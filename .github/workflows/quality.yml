name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on a branch or pull request are cancelled; main's never are.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to full commit SHAs, with the version in a comment, rather than floating on a
# tag. A tag is a name someone can move; a SHA is the code that actually ran. This matches Aemi's
# own workflows, and the drift between the two used to be a bug rather than a policy — see below.
env:
  SWIFT_VERSION: "6.4.1"

jobs:
  gate:
    # macos-26 matches the package's declared floor (.macOS(.v26)). Testing on the oldest supported
    # system is the point: it is the only way to notice that something quietly started using an API
    # newer than the floor it claims to support.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-swift v2 cannot install Swift 6.4: its version table stops at 6.2.1, so it fails with
      # "Version 6.4 is not available". v3 installs through swiftly, which resolves any published
      # toolchain, and 6.4 is published.
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Restore the SwiftPM tree
        id: spm-gate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-gate-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-gate-${{ runner.os }}-${{ env.SWIFT_VERSION }}-
      - name: Restore the analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Pinned by version and SHA-256 in Scripts/analyzers.sh, which re-verifies the hash; the cache only
          # saves the download.
          path: ~/Library/Caches/ask/analyzers
          key: analyzers-${{ hashFiles('Scripts/analyzers.sh') }}
      - name: SwiftLint (metrics)
        # The runner image already ships SwiftLint; install only when it is missing.
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version
      - name: Quality gate
        # --check: fail if the tree is not already canonical, so a formatting drift is a red build
        # rather than something a reviewer has to notice.
        run: Scripts/quality.sh --check
      - name: Save the SwiftPM tree
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.spm-gate.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-gate-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

  budgets:
    # After the gate: a tree that fails format, metrics, analyzers or tests is not worth a PTY measurement.
    needs: gate
    # The four performance budgets, enforced by running the real binary on a real PTY. Same pinned
    # runner as the gate: these are hardware-specific numbers, and a budget measured on one machine
    # and enforced on another fires for the wrong reason, which is worse than no budget because it
    # trains people to ignore red.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-swift v2 cannot install Swift 6.4: its version table stops at 6.2.1, so it fails with
      # "Version 6.4 is not available". v3 installs through swiftly, which resolves any published
      # toolchain, and 6.4 is published.
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Restore the SwiftPM tree
        id: spm-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-${{ env.SWIFT_VERSION }}-
      - name: Build release
        run: swift build -c release
      - name: Measure the four budgets
        # Exits non-zero when any budget is over. The limits come from the binary itself
        # (`ask --budgets`), so there is one definition and no copy in a script to drift.
        run: python3 Scripts/measure-budgets.py .build/release/ask 12
      - name: Save the SwiftPM tree
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.spm-release.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

  result:
    name: quality result
    needs: [gate, budgets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          if grep -E '"result": "(failure|cancelled)"' needs.json; then exit 1; fi
