name: Mutation

# Mutation testing (roadmap 0166), once a day, not on every push (owner, 2026-11-01): the Sources files changed in the last day, with no
# new surviving mutant allowed beyond development/mutation-baseline.json; on Mondays every file, uploading a fresh baseline to commit by
# hand. Run by hand, it takes the scope it is given: the files changed in the last day by default, to confirm a fix in minutes. Every
# file is about 5000 mutants, longer than a job's limit, so the full run is 20 shards of about 300 mutants (owner, 2026-11-13), each a
# job, and a last job merges their baseline parts; it writes none unless every shard finished.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "changed: the Sources files changed in the last day; all: every file and the baseline"
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: Plan · Choose Scope
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.kind.outputs.all }}
    steps:
      - name: Plan · Choose Scope
        id: kind
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if [ "${{ inputs.scope }}" = all ]; then echo "all=true" >> "$GITHUB_OUTPUT"; fi
          elif [ "$(date -u +%u)" = 1 ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

  mutate:
    name: Mutation · Sources · macOS
    needs: scope
    if: ${{ needs.scope.outputs.all != 'true' }}
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Yesterday's main must be in the clone for the diff.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup · Read .swift-version
        run: echo "SWIFT_VERSION=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Setup · Install Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      # The mutation tool builds through xcrun, which runs Xcode's own Swift (6.3.3 on macos-26, which cannot read a 6.4 manifest)
      # unless TOOLCHAINS names another: the one just installed.
      - name: Setup · Select the Installed Swift for xcrun
        run: |
          plist=$(find "$HOME/Library/Developer/Toolchains" -maxdepth 2 -path "*/swift-$SWIFT_VERSION*.xctoolchain/Info.plist" | sort | head -1)
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$plist")" >> "$GITHUB_ENV"
      - name: Cache · Mutation Tool & Verdicts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The tool is pinned by version and SHA-256 in the script, which re-verifies a download; the verdict cache is keyed by
          # mutant, so a stale one only costs reruns.
          path: |
            ~/Library/Caches/g-cqd-mutation
            .swift-mutation-testing-cache
          key: mutation-${{ hashFiles('Scripts/mutate-changed.sh') }}-${{ github.sha }}
          restore-keys: mutation-${{ hashFiles('Scripts/mutate-changed.sh') }}-
      - name: Mutation · Files Changed in the Last Day
        run: |
          base=$(git rev-list -1 --before="24 hours ago" HEAD)
          Scripts/mutate-changed.sh "${base:-$(git rev-list --max-parents=0 HEAD)}"

  full:
    name: Mutation · ${{ matrix.target }} ${{ matrix.shard }} · macOS
    needs: scope
    if: ${{ needs.scope.outputs.all == 'true' }}
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # About 300 mutants a shard (2026-11-13: 5062 in the targets with tests), so each ends well within the limit. The count of
        # shards is the merge's expected parts below.
        include:
          - { target: AskTUI, shard: "1/6" }
          - { target: AskTUI, shard: "2/6" }
          - { target: AskTUI, shard: "3/6" }
          - { target: AskTUI, shard: "4/6" }
          - { target: AskTUI, shard: "5/6" }
          - { target: AskTUI, shard: "6/6" }
          - { target: AskAgentCore, shard: "1/5" }
          - { target: AskAgentCore, shard: "2/5" }
          - { target: AskAgentCore, shard: "3/5" }
          - { target: AskAgentCore, shard: "4/5" }
          - { target: AskAgentCore, shard: "5/5" }
          - { target: AskAI, shard: "1/4" }
          - { target: AskAI, shard: "2/4" }
          - { target: AskAI, shard: "3/4" }
          - { target: AskAI, shard: "4/4" }
          - { target: AskTools, shard: "1/2" }
          - { target: AskTools, shard: "2/2" }
          - { target: AskMCP, shard: "1/1" }
          - { target: AskApple, shard: "1/1" }
          - { target: AskCore, shard: "1/1" }
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Yesterday's main must be in the clone for the diff.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup · Read .swift-version
        run: echo "SWIFT_VERSION=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Setup · Install Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      # The mutation tool builds through xcrun, which runs Xcode's own Swift (6.3.3 on macos-26, which cannot read a 6.4 manifest)
      # unless TOOLCHAINS names another: the one just installed.
      - name: Setup · Select the Installed Swift for xcrun
        run: |
          plist=$(find "$HOME/Library/Developer/Toolchains" -maxdepth 2 -path "*/swift-$SWIFT_VERSION*.xctoolchain/Info.plist" | sort | head -1)
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$plist")" >> "$GITHUB_ENV"
      - name: Cache · Mutation Tool & Verdicts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The tool is pinned by version and SHA-256 in the script, which re-verifies a download; the verdict cache is keyed by
          # mutant, so a stale one only costs reruns.
          path: |
            ~/Library/Caches/g-cqd-mutation
            .swift-mutation-testing-cache
          key: mutation-${{ hashFiles('Scripts/mutate-changed.sh') }}-${{ github.sha }}-${{ matrix.target }}-${{ matrix.shard }}
          restore-keys: mutation-${{ hashFiles('Scripts/mutate-changed.sh') }}-
      - name: Mutation · Every File, One Shard
        run: Scripts/mutate-changed.sh --all "${{ matrix.target }}" "${{ matrix.shard }}"
      - name: Artifacts · Upload Baseline Part
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-part-${{ matrix.target }}-${{ strategy.job-index }}
          path: .build/mutation/baseline-*.json
          if-no-files-found: ignore

  baseline:
    name: Mutation · Merge the Baseline
    needs: [scope, full]
    if: ${{ always() && needs.scope.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts · Download Baseline Parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: baseline-part-*
          path: parts
      - name: Mutation · Merge the Baseline
        run: Scripts/mutate-changed.sh merge parts 20
      - name: Artifacts · Upload Mutation Baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-baseline
          path: development/mutation-baseline.json
