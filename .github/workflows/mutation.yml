name: Mutation

# Mutation testing (roadmap 0166) with litmus, in CI only, once a day and not on every push (owner, 2026-11-01 and 2026-11-16): the
# Sources files changed in the last day, with no new surviving mutant allowed beyond development/mutation-baseline.json; on Mondays
# every file, uploading a fresh baseline to commit by hand. Run by hand, it takes the scope it is given: the files changed in the last
# day by default. Every file is longer than a job's limit, so the full run is 8 shards, each whole targets and a job, and a last job
# merges their runs into one and writes the baseline from it. A run stops starting work at its budget and says what it did not run,
# so a job ends with what it found; Scripts/mutate-changed.sh holds the tool's pin and its options.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "changed: the Sources files changed in the last day; all: every file and the baseline"
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: Plan · Choose Scope
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.kind.outputs.all }}
    steps:
      - name: Plan · Choose Scope
        id: kind
        # Inputs reach the shell as environment variables, never pasted into the script (code scanning, 2026-11-27).
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$SCOPE" = all ]; then echo "all=true" >> "$GITHUB_OUTPUT"; fi
          elif [ "$(date -u +%u)" = 1 ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

  mutate:
    name: Mutation · Sources · macOS
    needs: scope
    if: ${{ needs.scope.outputs.all != 'true' }}
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Yesterday's main must be in the clone for the diff.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup · Read .swift-version
        run: echo "SWIFT_VERSION=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Setup · Install Swift
        uses: g-cqd/swift-ci/setup-swift@07936b09eef98d5fcef4eac36a7c3f97de133e19 # swift-ci 07936b0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      # litmus builds through xcrun, which runs Xcode's own Swift (6.3.3 on macos-26, which cannot read a 6.4 manifest) unless
      # TOOLCHAINS names another: the one just installed.
      - name: Setup · Select the Installed Swift for xcrun
        run: |
          plist=$(find "$HOME/Library/Developer/Toolchains" -maxdepth 2 -path "*/swift-$SWIFT_VERSION*.xctoolchain/Info.plist" | sort | head -1)
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$plist")" >> "$GITHUB_ENV"
      - name: Mutation · Files Changed in the Last Day
        env:
          LITMUS_OUTPUT: ${{ runner.temp }}/litmus-run
        run: |
          base=$(git rev-list -1 --before="24 hours ago" HEAD)
          Scripts/mutate-changed.sh "${base:-$(git rev-list --max-parents=0 HEAD)}"
      # What the run recorded, whatever ended it: a job cancelled at its limit left nothing to read (2026-11-12 to 16).
      - name: Artifacts · Upload the Run
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: litmus-changed
          path: |
            ${{ runner.temp }}/litmus-run/run.json
            ${{ runner.temp }}/litmus-run/run.pb
            ${{ runner.temp }}/litmus-run/logs
          if-no-files-found: ignore
          retention-days: 14

  full:
    name: Mutation · Shard ${{ matrix.shard }} of 8 · macOS
    needs: scope
    if: ${{ needs.scope.outputs.all == 'true' }}
    runs-on: macos-26
    # A shard's budget is five hours, and a hosted job's limit six.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # A shard is whole targets, the largest alone, so there are fewer shards than targets with sources (ten): none is empty.
        # The count is in the job's name and in the script's argument below.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup · Read .swift-version
        run: echo "SWIFT_VERSION=$(cat .swift-version)" >> "$GITHUB_ENV"
      - name: Setup · Install Swift
        uses: g-cqd/swift-ci/setup-swift@07936b09eef98d5fcef4eac36a7c3f97de133e19 # swift-ci 07936b0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      # litmus builds through xcrun, which runs Xcode's own Swift (6.3.3 on macos-26, which cannot read a 6.4 manifest) unless
      # TOOLCHAINS names another: the one just installed.
      - name: Setup · Select the Installed Swift for xcrun
        run: |
          plist=$(find "$HOME/Library/Developer/Toolchains" -maxdepth 2 -path "*/swift-$SWIFT_VERSION*.xctoolchain/Info.plist" | sort | head -1)
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$plist")" >> "$GITHUB_ENV"
      - name: Mutation · Every File, One Shard
        env:
          LITMUS_OUTPUT: ${{ runner.temp }}/litmus-run
        run: Scripts/mutate-changed.sh --all "${{ matrix.shard }}/8"
      - name: Artifacts · Upload the Shard's Run
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: litmus-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/litmus-run/run.json
            ${{ runner.temp }}/litmus-run/run.pb
          if-no-files-found: ignore
      - name: Artifacts · Upload the Logs of a Shard that Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: litmus-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/litmus-run/logs
          if-no-files-found: ignore
          retention-days: 14

  baseline:
    name: Mutation · Merge the Baseline
    needs: [scope, full]
    if: ${{ always() && needs.scope.outputs.all == 'true' }}
    # litmus is published for macOS on Apple silicon only.
    runs-on: macos-26
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Artifacts · Download the Shards' Runs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: litmus-shard-*
          path: ${{ runner.temp }}/parts
      # litmus refuses to merge unless every shard is there, once, of one plan and one commit.
      - name: Mutation · Merge the Shards & Write the Baseline
        env:
          LITMUS_OUTPUT: ${{ runner.temp }}/litmus-merged
        run: Scripts/mutate-changed.sh merge "${{ runner.temp }}/parts"
      - name: Artifacts · Upload Mutation Baseline
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-baseline
          path: development/mutation-baseline.json
          if-no-files-found: ignore
      - name: Artifacts · Upload the Merged Run
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: litmus-merged
          path: |
            ${{ runner.temp }}/litmus-merged/run.json
            ${{ runner.temp }}/litmus-merged/report.md
          if-no-files-found: ignore

  report:
    name: Mutation · Failure Issue
    needs: [scope, mutate, full, baseline]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report · Open or Close the Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # A cancelled run counts: the full run's cancellations went unseen for a week (roadmap 0211).
          OUTCOME: >-
            ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: Scripts/ci-failure-issue.sh Mutation "$OUTCOME" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
